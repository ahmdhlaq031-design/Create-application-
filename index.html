// ==================== 3. الشعب ===================================================================
// ===================================================================
function renderClasses() {
    return `
        <div class="card">
            <div class="card-title"><span>إضافة سريعة حسب الصف</span></div>
            <div class="helper">اضغط على الصف لإضافة شعبة جديدة</div>
            <div class="grades-grid">
                ${GRADES.map(g => {
                    const count = state.gradeCounter[g.key] || 0;
                    return `
                        <button class="btn btn-secondary grade-btn" onclick="addGradeClass('${g.key}')">
                            <span>${g.label}</span>
                            ${count > 0 ? `<span class="badge">${count}</span>` : ''}
                        </button>
                    `;
                }).join('')}
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span>إضافة يدوية</span></div>
            <div class="row row-2">
                <div class="field">
                    <label>اسم الشعبة</label>
                    <input type="text" id="className" placeholder="مثال: العاشر - الفيزياء" 
                           onkeypress="if(event.key==='Enter') addClass()">
                </div>
                <div class="field">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary btn-block" onclick="addClass()">إضافة الشعبة</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span>قائمة الشعب (${state.classes.length})</span></div>
            ${state.classes.length === 0 
                ? '<div class="empty"><div class="icon">—</div>لا توجد شعب</div>'
                : state.classes.map(c => {
                    const totalHours = (c.days || []).length * (c.periodsPerDay || 6);
                    const assignedHours = getClassAssignedHours(c.id);
                    const teacherCount = state.teachers.filter(t => 
                        (t.classAssignments || []).some(a => a.classId === c.id)
                    ).length;
                    return `
                        <div class="item">
                            <div class="item-head">
                                <div class="item-title">${esc(c.name)}</div>
                                <div class="item-actions">
                                    <button class="btn btn-secondary btn-xs" onclick="openClassSettings('${c.id}')">إعدادات</button>
                                    <button class="btn btn-danger btn-xs" onclick="deleteClass('${c.id}')">حذف</button>
                                </div>
                            </div>
                            <div class="item-meta">
                                <span class="tag tag-blue">${(c.days || []).length} أيام/أسبوع</span>
                                <span class="tag tag-orange">${c.periodsPerDay || 6} حصص/يوم</span>
                                <span class="tag tag-blue">${totalHours} حصة أسبوعياً</span>
                                <span class="tag tag-green">${teacherCount} أستاذ</span>
                                <span class="tag ${assignedHours === totalHours ? 'tag-green' : (assignedHours > totalHours ? 'tag-red' : 'tag-orange')}">
                                    ${assignedHours} / ${totalHours} موزعة
                                </span>
                            </div>
                            <div class="item-meta">
                                ${(c.days || []).map(d => `<span class="tag">${d}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }).join('')
            }
        </div>
    `;
}

function addGradeClass(gradeKey) {
    const grade = GRADES.find(g => g.key === gradeKey);
    if (!grade) return;
    state.gradeCounter[gradeKey] = (state.gradeCounter[gradeKey] || 0) + 1;
    const num = state.gradeCounter[gradeKey];
    const ordinals = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'];
    const ord = ordinals[num - 1] || `رقم ${num}`;
    const name = `${grade.label} - شعبة ${ord}`;
    
    state.classes.push({
        id: uid('c'), name, grade: gradeKey,
        days: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'],
        periodsPerDay: 6
    });
    save(); render();
    toast(`تمت إضافة "${name}"`);
}

function addClass() {
    const name = document.getElementById('className').value.trim();
    if (!name) { toast('أدخل اسم الشعبة', 'error'); return; }
    if (state.classes.some(c => c.name === name)) { toast('موجودة', 'error'); return; }
    state.classes.push({
        id: uid('c'), name,
        days: ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'],
        periodsPerDay: 6
    });
    save(); render();
    toast('تمت الإضافة');
}

function deleteClass(id) {
    const c = findClass(id);
    if (!c) return;
    if (!confirm(`حذف "${c.name}"؟`)) return;
    state.classes = state.classes.filter(x => x.id !== id);
    if (c.grade && state.gradeCounter[c.grade]) {
        state.gradeCounter[c.grade] = Math.max(0, state.gradeCounter[c.grade] - 1);
    }
    state.teachers.forEach(t => {
        if (t.classAssignments) t.classAssignments = t.classAssignments.filter(a => a.classId !== id);
    });
    for (const k in state.fixedSlots) {
        if (k.startsWith(id + '_')) delete state.fixedSlots[k];
    }
    save(); render();
    toast('تم الحذف');
}

function openClassSettings(id) {
    const c = findClass(id);
    if (!c) return;
    window._editClass = { id, days: [...(c.days || [])], periodsPerDay: c.periodsPerDay || 6 };
    
    const html = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
                <div class="modal-header">
                    <h3>إعدادات الشعبة: ${esc(c.name)}</h3>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-body">
                    <div class="field">
                        <label>اسم الشعبة</label>
                        <input type="text" id="ecName" value="${esc(c.name)}">
                    </div>
                    <div class="field">
                        <label>أيام الدراسة</label>
                        <div class="chip-grid" id="ecDaysGrid">
                            ${ALL_DAYS.map(d => `
                                <div class="chip ${window._editClass.days.includes(d) ? 'on' : ''}" 
                                     onclick="toggleEditDay('${d}')">
                                    ${d}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="row row-2">
                        <div class="field">
                            <label>عدد الحصص في اليوم</label>
                            <input type="number" id="ecPeriods" value="${window._editClass.periodsPerDay}" 
                                   min="1" max="12" onchange="updateEditTotal()" oninput="updateEditTotal()">
                        </div>
                        <div class="field">
                            <label>المجموع الأسبوعي</label>
                            <input type="text" id="ecTotal" value="${window._editClass.days.length * window._editClass.periodsPerDay}" 
                                   readonly style="background: #f0f2ea; text-align: center; font-weight: 700; color: var(--primary-dark);">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
                    <button class="btn btn-primary" onclick="saveClassSettings()">حفظ</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

function toggleEditDay(day) {
    if (window._editClass.days.includes(day)) {
        window._editClass.days = window._editClass.days.filter(d => d !== day);
    } else {
        window._editClass.days.push(day);
    }
    const grid = document.getElementById('ecDaysGrid');
    grid.innerHTML = ALL_DAYS.map(d => `
        <div class="chip ${window._editClass.days.includes(d) ? 'on' : ''}" onclick="toggleEditDay('${d}')">${d}</div>
    `).join('');
    updateEditTotal();
}

function updateEditTotal() {
    const periods = parseInt(document.getElementById('ecPeriods').value) || 6;
    window._editClass.periodsPerDay = periods;
    document.getElementById('ecTotal').value = window._editClass.days.length * periods;
}

function saveClassSettings() {
    const c = findClass(window._editClass.id);
    if (!c) return;
    const name = document.getElementById('ecName').value.trim();
    if (!name) { toast('أدخل الاسم', 'error'); return; }
    if (window._editClass.days.length === 0) { toast('اختر يوم واحد على الأقل', 'error'); return; }
    c.name = name;
    c.days = [...window._editClass.days];
    c.periodsPerDay = window._editClass.periodsPerDay;
    save(); closeModal(); render();
    toast('تم الحفظ');
}

// ===================================================================
// ==================== 4. البرامج ===================================================================
// ===================================================================
function renderPrograms() {
    if (state.programView === 'menu') return renderProgramsMenu();
    if (state.programView === 'generate') return renderProgramGenerate();
    if (state.programView === 'manual') return renderProgramManual();
    if (state.programView === 'viewer') return renderProgramViewer();
    return renderProgramsMenu();
}

function renderProgramsMenu() {
    const totalRequired = state.classes.reduce((s, c) => s + getClassTotalHours(c.id), 0);
    const totalAssigned = state.classes.reduce((s, c) => s + getClassAssignedHours(c.id), 0);
    
    return `
        <div class="card">
            <div class="card-title"><span>إدارة البرامج</span></div>
            
            <div class="stats">
                <div class="stat">
                    <div class="num">${state.classes.length}</div>
                    <div class="lbl">الشعب</div>
                </div>
                <div class="stat ${totalAssigned >= totalRequired ? 'ok' : 'err'}">
                    <div class="num">${totalAssigned} / ${totalRequired}</div>
                    <div class="lbl">الحصص الموزعة</div>
                </div>
                <div class="stat">
                    <div class="num">${Object.keys(state.fixedSlots).length}</div>
                    <div class="lbl">حصص مثبتة</div>
                </div>
                <div class="stat ${state.schedule ? 'ok' : ''}">
                    <div class="num">${state.schedule ? 'جاهز' : '—'}</div>
                    <div class="lbl">حالة الجدول</div>
                </div>
            </div>
            
            <div class="row row-2">
                <button class="btn btn-success btn-lg" onclick="goProgramView('generate')" 
                        style="padding: 22px; flex-direction: column; gap: 6px;">
                    <div style="font-size: 1rem;">إنشاء البرنامج</div>
                    <div style="font-size: 0.72rem; opacity: 0.9; font-weight: 500;">توليد الجداول لجميع الشعب تلقائياً</div>
                </button>
                
                <button class="btn btn-warning btn-lg" onclick="goProgramView('manual')" 
                        style="padding: 22px; flex-direction: column; gap: 6px;">
                    <div style="font-size: 1rem;">التثبيت اليدوي</div>
                    <div style="font-size: 0.72rem; opacity: 0.9; font-weight: 500;">تثبيت حصص معينة قبل التوليد</div>
                </button>
            </div>
            
            <div style="margin-top: 10px;">
                <button class="btn btn-primary btn-lg" onclick="goProgramView('viewer')" 
                        style="padding: 18px; width: 100%; flex-direction: column; gap: 5px;"
                        ${!state.schedule ? 'disabled' : ''}>
                    <div style="font-size: 0.95rem;">عرض البرامج المُنشأة</div>
                    <div style="font-size: 0.7rem; opacity: 0.9; font-weight: 500;">
                        ${state.schedule ? 'عرض وتحميل وطباعة الجداول' : 'قم بإنشاء البرنامج أولاً'}
                    </div>
                </button>
            </div>
        </div>
    `;
}

function goProgramView(view) {
    state.programView = view;
    render();
}

function renderProgramGenerate() {
    const totalRequired = state.classes.reduce((s, c) => s + getClassTotalHours(c.id), 0);
    const totalAssigned = state.classes.reduce((s, c) => s + getClassAssignedHours(c.id), 0);
    
    const issues = [];
    state.classes.forEach(c => {
        const required = getClassTotalHours(c.id);
        const assigned = getClassAssignedHours(c.id);
        if (assigned < required) issues.push(`"${c.name}": المطلوب ${required} حصة، الموزع ${assigned} (ينقص ${required - assigned})`);
        else if (assigned > required) issues.push(`"${c.name}": المطلوب ${required} حصة، الموزع ${assigned} (زيادة ${assigned - required})`);
    });
    
    return `
        <div class="card">
            <div class="card-title">
                <span>إنشاء البرنامج</span>
                <button class="btn btn-secondary btn-sm" onclick="goProgramView('menu')">رجوع</button>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="num">${state.classes.length}</div>
                    <div class="lbl">الشعب</div>
                </div>
                <div class="stat ${totalAssigned >= totalRequired ? 'ok' : 'err'}">
                    <div class="num">${totalAssigned} / ${totalRequired}</div>
                    <div class="lbl">حصص موزعة</div>
                </div>
                <div class="stat">
                    <div class="num">${Object.keys(state.fixedSlots).length}</div>
                    <div class="lbl">حصص مثبتة</div>
                </div>
            </div>
            
            ${issues.length === 0 && totalAssigned > 0
                ? `<div class="alert alert-success">جميع البيانات جاهزة. اضغط الزر أدناه لتوليد البرنامج.</div>`
                : issues.length > 0
                    ? `<div class="alert alert-warning"><div>${issues.slice(0, 5).join('<br>')}${issues.length > 5 ? `<br>... و ${issues.length - 5} مشكلة أخرى` : ''}</div></div>`
                    : `<div class="alert alert-warning">لم يتم توزيع أي حصص بعد</div>`
            }
            
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
                <button class="btn btn-success btn-lg" onclick="generateSchedule()" 
                        ${totalAssigned === 0 ? 'disabled' : ''}>
                    توليد البرنامج
                </button>
                ${state.schedule ? `
                    <button class="btn btn-warning btn-lg" onclick="clearSchedule()">
                        مسح البرنامج
                    </button>
                ` : ''}
            </div>
        </div>
    `;
}

function renderProgramManual() {
    if (state.classes.length === 0) {
        return `
            <div class="card">
                <div class="card-title">
                    <span>التثبيت اليدوي</span>
                    <button class="btn btn-secondary btn-sm" onclick="goProgramView('menu')">رجوع</button>
                </div>
                <div class="empty"><div class="icon">—</div>أضف شعباً أولاً</div>
            </div>
        `;
    }
    
    if (!window._manualClassId || !findClass(window._manualClassId)) {
        window._manualClassId = state.classes[0].id;
    }
    const c = findClass(window._manualClassId);
    
    const grid = {};
    (c.days || []).forEach(d => { grid[d] = new Array(c.periodsPerDay || 6).fill(null); });
    if (state.schedule && state.schedule[c.id]) {
        (c.days || []).forEach(d => {
            for (let p = 0; p < (c.periodsPerDay || 6); p++) {
                if (state.schedule[c.id][d] && state.schedule[c.id][d][p]) {
                    grid[d][p] = { ...state.schedule[c.id][d][p] };
                }
            }
        });
    }
    for (const k in state.fixedSlots) {
        const parts = k.split('_');
        if (parts[0] === c.id) {
            const day = parts[1], period = parseInt(parts[2]);
            if (grid[day] && period < grid[day].length) {
                grid[day][period] = { ...state.fixedSlots[k], fixed: true };
            }
        }
    }
    
    return `
        <div class="card">
            <div class="card-title">
                <span>التثبيت اليدوي</span>
                <div style="display: flex; gap: 6px;">
                    <button class="btn btn-warning btn-sm" onclick="clearClassFixed('${c.id}')">مسح التثبيتات</button>
                    <button class="btn btn-secondary btn-sm" onclick="goProgramView('menu')">رجوع</button>
                </div>
            </div>
            
            <div class="field">
                <label>اختر الشعبة</label>
                <div class="chip-grid">
                    ${state.classes.map(cl => `
                        <div class="chip ${cl.id === c.id ? 'on' : ''}" onclick="setManualClass('${cl.id}')">
                            ${esc(cl.name)}
                        </div>
                    `).join('')}
                </div>
            </div>
            
            ${state.subjects.length === 0 
                ? '<div class="alert alert-warning">أضف مواد أولاً</div>'
                : `
                    <div class="row row-2">
                        <div class="field">
                            <label>المادة</label>
                            <select id="mSubject">
                                <option value="">— اختر المادة —</option>
                                ${state.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
                            </select>
                        </div>
                        <div class="field">
                            <label>الأستاذ (اختياري)</label>
                            <select id="mTeacher">
                                <option value="">— تلقائي —</option>
                                ${state.teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    
                    <div class="alert alert-info">
                        اختر مادة ثم اضغط على أي خانة لتثبيتها. اضغط على خانة مثبتة لإلغاء تثبيتها.
                    </div>
                    
                    <div class="tt-wrap" style="margin-top: 10px;">
                        <table class="tt">
                            <thead>
                                <tr>
                                    <th class="corner">اليوم / الحصة</th>
                                    ${Array.from({length: c.periodsPerDay || 6}, (_, i) => `<th>الحصة ${i+1}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${(c.days || []).map(day => `
                                    <tr>
                                        <td class="day-cell">${day}</td>
                                        ${Array.from({length: c.periodsPerDay || 6}, (_, p) => {
                                            const slot = grid[day][p];
                                            if (slot) {
                                                const subj = findSubject(slot.subjectId);
                                                const tea = findTeacher(slot.teacherId);
                                                const cls = slot.fixed ? 'slot fixed' : 'slot filled';
                                                return `
                                                    <td class="clickable" onclick="handleManualClick('${c.id}', '${day}', ${p})">
                                                        <div class="${cls}" style="position: relative;">
                                                            ${slot.fixed ? '<span class="pin">•</span>' : ''}
                                                            <span class="slot-sub">${subj ? esc(subj.name) : '؟'}</span>
                                                            <span class="slot-teacher">${tea ? esc(tea.name) : '؟'}</span>
                                                        </div>
                                                    </td>
                                                `;
                                            }
                                            return `
                                                <td class="clickable" onclick="handleManualClick('${c.id}', '${day}', ${p})">
                                                    <div class="slot empty">—</div>
                                                </td>
                                            `;
                                        }).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `
            }
        </div>
    `;
}

function setManualClass(id) {
    window._manualClassId = id;
    render();
}

function handleManualClick(classId, day, period) {
    const key = classId + '_' + day + '_' + period;
    if (state.fixedSlots[key]) {
        delete state.fixedSlots[key];
        save(); render();
        toast('تم إلغاء التثبيت');
        return;
    }
    const subjectId = document.getElementById('mSubject').value;
    if (!subjectId) { toast('اختر المادة أولاً', 'error'); return; }
    let teacherId = document.getElementById('mTeacher').value;
    if (!teacherId) {
        const teachersOfSubj = state.teachers.filter(t => t.subjectId === subjectId);
        if (teachersOfSubj.length === 0) { toast('لا يوجد أستاذ لهذه المادة', 'error'); return; }
        teacherId = teachersOfSubj[0].id;
    }
    state.fixedSlots[key] = { subjectId, teacherId };
    save(); render();
    toast('تم التثبيت');
}

function clearClassFixed(classId) {
    if (!confirm('مسح كل التثبيتات لهذه الشعبة؟')) return;
    for (const k in state.fixedSlots) {
        if (k.startsWith(classId + '_')) delete state.fixedSlots[k];
    }
    save(); render();
    toast('تم المسح');
}

function renderProgramViewer() {
    if (!state.schedule) {
        return `
            <div class="card">
                <div class="card-title">
                    <span>عرض البرامج</span>
                    <button class="btn btn-secondary btn-sm" onclick="goProgramView('menu')">رجوع</button>
                </div>
                <div class="empty">
                    <div class="icon">—</div>
                    <div>لم يتم إنشاء البرنامج بعد</div>
                    <div style="margin-top: 12px;">
                        <button class="btn btn-success" onclick="goProgramView('generate')">اذهب للإنشاء</button>
                    </div>
                </div>
            </div>
        `;
    }
    
    let body = '';
    if (state.currentView === 'all') body = state.classes.map(c => renderClassTable(c.id)).join('');
    else if (state.currentView.startsWith('c_')) body = renderClassTable(state.currentView.substring(2));
    else if (state.currentView.startsWith('t_')) body = renderTeacherTable(state.currentView.substring(2));
    
    return `
        <div class="card">
            <div class="card-title">
                <span>عرض البرامج</span>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button class="btn btn-primary btn-sm" onclick="downloadAll()">تحميل كل الشعب</button>
                    <button class="btn btn-secondary btn-sm" onclick="printAll()">طباعة</button>
                    <button class="btn btn-secondary btn-sm" onclick="goProgramView('menu')">رجوع</button>
                </div>
            </div>
            
            <div class="chip-grid">
                <div class="chip ${state.currentView === 'all' ? 'on' : ''}" onclick="setView('all')">
                    كل الشعب
                </div>
                ${state.classes.map(c => `
                    <div class="chip ${state.currentView === 'c_' + c.id ? 'on' : ''}" onclick="setView('c_${c.id}')">
                        ${esc(c.name)}
                    </div>
                `).join('')}
                ${state.teachers.map(t => `
                    <div class="chip ${state.currentView === 't_' + t.id ? 'on' : ''}" onclick="setView('t_${t.id}')">
                        ${esc(t.name)}
                    </div>
                `).join('')}
            </div>
        </div>
        
        <div id="scheduleArea">${body}</div>
    `;
}

function setView(view) { state.currentView = view; render(); }

function renderClassTable(classId) {
    const c = findClass(classId);
    if (!c) return '';
    const grid = state.schedule[classId];
    if (!grid) return '';
    return `
        <div class="card" id="classTable_${classId}">
            <div class="card-title">
                <span>${esc(c.name)}</span>
                <span class="tag tag-blue">${(c.days || []).length * (c.periodsPerDay || 6)} حصة/أسبوع</span>
            </div>
            <div class="tt-wrap">
                <table class="tt">
                    <thead>
                        <tr>
                            <th class="corner">اليوم / الحصة</th>
                            ${Array.from({length: c.periodsPerDay || 6}, (_, i) => `<th>الحصة ${i+1}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${(c.days || []).map(day => `
                            <tr>
                                <td class="day-cell">${day}</td>
                                ${Array.from({length: c.periodsPerDay || 6}, (_, p) => {
                                    const slot = grid[day] ? grid[day][p] : null;
                                    if (slot) {
                                        const subj = findSubject(slot.subjectId);
                                        const tea = findTeacher(slot.teacherId);
                                        return `
                                            <td>
                                                <div class="slot filled">
                                                    <span class="slot-sub">${subj ? esc(subj.name) : '؟'}</span>
                                                    <span class="slot-teacher">${tea ? esc(tea.name) : '؟'}</span>
                                                </div>
                                            </td>
                                        `;
                                    }
                                    return `<td><div class="slot empty">—</div></td>`;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function renderTeacherTable(teacherId) {
    const t = findTeacher(teacherId);
    if (!t) return '';
    const subj = findSubject(t.subjectId);
    const allDays = new Set();
    let maxPeriods = 0;
    state.classes.forEach(c => {
        (c.days || []).forEach(d => allDays.add(d));
        maxPeriods = Math.max(maxPeriods, c.periodsPerDay || 6);
    });
    const orderedDays = ALL_DAYS.filter(d => allDays.has(d));
    return `
        <div class="card" id="teacherTable_${teacherId}">
            <div class="card-title">
                <span>${esc(t.name)}</span>
                ${subj ? `<span class="tag tag-green">${esc(subj.name)}</span>` : ''}
            </div>
            <div class="tt-wrap">
                <table class="tt">
                    <thead>
                        <tr>
                            <th class="corner">اليوم / الحصة</th>
                            ${Array.from({length: maxPeriods}, (_, i) => `<th>الحصة ${i+1}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${orderedDays.map(day => `
                            <tr>
                                <td class="day-cell">${day}</td>
                                ${Array.from({length: maxPeriods}, (_, p) => {
                                    let found = null;
                                    for (const c of state.classes) {
                                        const g = state.schedule[c.id];
                                        if (g && g[day] && g[day][p] && g[day][p].teacherId === teacherId) {
                                            found = { slot: g[day][p], className: c.name };
                                            break;
                                        }
                                    }
                                    if (found) {
                                        const sj = findSubject(found.slot.subjectId);
                                        return `
                                            <td>
                                                <div class="slot filled">
                                                    <span class="slot-sub">${sj ? esc(sj.name) : '؟'}</span>
                                                    <span class="slot-teacher">${esc(found.className)}</span>
                                                </div>
                                            </td>
                                        `;
                                    }
                                    return `<td><div class="slot empty">—</div></td>`;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

// ===================================================================
// ==================== التوليد ===================================================================
// ===================================================================
function generateSchedule() {
    if (state.classes.length === 0) { toast('أضف شعباً', 'error'); return; }
    if (state.teachers.length === 0) { toast('أضف أساتذة', 'error'); return; }
    
    const lessons = [];
    for (const t of state.teachers) {
        for (const a of (t.classAssignments || [])) {
            const c = findClass(a.classId);
            if (!c) continue;
            if (a.subjects && a.subjects.length) {
                for (const sub of a.subjects) {
                    for (let i = 0; i < sub.hours; i++) {
                        lessons.push({ 
                            classId: a.classId, 
                            teacherId: t.id, 
                            subjectId: sub.subjectId 
                        });
                    }
                }
            } else if (a.hours) {
                for (let i = 0; i < a.hours; i++) {
                    lessons.push({ 
                        classId: a.classId, 
                        teacherId: t.id, 
                        subjectId: t.subjectId 
                    });
                }
            }
        }
    }
    if (lessons.length === 0) { toast('لا توجد دروس', 'error'); return; }
    
    const groups = {};
    lessons.forEach(l => {
        const key = `${l.classId}_${l.subjectId}_${l.teacherId}`;
        if (!groups[key]) groups[key] = { ...l, count: 0 };
        groups[key].count++;
    });
    const teacherLoad = {};
    state.teachers.forEach(t => teacherLoad[t.id] = 0);
    Object.values(groups).forEach(g => teacherLoad[g.teacherId] += g.count);
    const sortedGroups = Object.values(groups).sort((a, b) => {
        if (teacherLoad[a.teacherId] !== teacherLoad[b.teacherId])
            return teacherLoad[b.teacherId] - teacherLoad[a.teacherId];
        return b.count - a.count;
    });
    const finalLessons = [];
    sortedGroups.forEach(g => {
        for (let i = 0; i < g.count; i++) {
            finalLessons.push({ classId: g.classId, subjectId: g.subjectId, teacherId: g.teacherId });
        }
    });
    
    let success = false;
    let classGrid = null;
    const maxAttempts = 150;
    
    for (let attempt = 0; attempt < maxAttempts && !success; attempt++) {
        classGrid = {};
        state.classes.forEach(c => {
            classGrid[c.id] = {};
            (c.days || []).forEach(d => { classGrid[c.id][d] = new Array(c.periodsPerDay || 6).fill(null); });
        });
        const teacherBusy = {};
        state.teachers.forEach(t => teacherBusy[t.id] = new Set());
        
        for (const k in state.fixedSlots) {
            const parts = k.split('_');
            const cid = parts[0], day = parts[1], period = parseInt(parts[2]);
            const fs = state.fixedSlots[k];
            if (classGrid[cid] && classGrid[cid][day] && period < classGrid[cid][day].length) {
                classGrid[cid][day][period] = { subjectId: fs.subjectId, teacherId: fs.teacherId, fixed: true };
                if (teacherBusy[fs.teacherId]) teacherBusy[fs.teacherId].add(`${day}_${period}`);
            }
        }
        
        const shuffled = [...finalLessons].sort(() => Math.random() - 0.5);
        success = true;
        for (const lesson of shuffled) {
            if (!placeLesson(lesson, classGrid, teacherBusy)) { success = false; break; }
        }
    }
    
    if (!success) { toast('تعذر إنشاء البرنامج. حاول تعديل التوزيعات.', 'error'); return; }
    
    state.schedule = classGrid;
    save();
    state.programView = 'viewer';
    state.currentView = 'all';
    render();
    toast('تم إنشاء البرنامج بنجاح');
}

function placeLesson(lesson, classGrid, teacherBusy) {
    const { classId, subjectId, teacherId } = lesson;
    const c = findClass(classId);
    if (!c) return false;
    const available = [];
    (c.days || []).forEach(day => {
        if (!classGrid[classId] || !classGrid[classId][day]) return;
        for (let p = 0; p < (c.periodsPerDay || 6); p++) {
            if (classGrid[classId][day][p] !== null) continue;
            if (teacherBusy[teacherId] && teacherBusy[teacherId].has(`${day}_${p}`)) continue;
            const sameSubjectToday = classGrid[classId][day].some(s => s && s.subjectId === subjectId);
            available.push({ day, period: p, sameSubjectToday });
        }
    });
    if (available.length === 0) return false;
    available.sort((a, b) => {
        if (a.sameSubjectToday !== b.sameSubjectToday) return a.sameSubjectToday ? 1 : -1;
        const loadA = classGrid[classId][a.day].filter(x => x !== null).length;
        const loadB = classGrid[classId][b.day].filter(x => x !== null).length;
        if (loadA !== loadB) return loadA - loadB;
        return Math.random() - 0.5;
    });
    const topN = available.slice(0, Math.min(5, available.length));
    const chosen = topN[Math.floor(Math.random() * topN.length)];
    classGrid[classId][chosen.day][chosen.period] = { subjectId, teacherId };
    teacherBusy[teacherId].add(`${chosen.day}_${chosen.period}`);
    return true;
}

function clearSchedule() {
    if (!confirm('مسح البرنامج الحالي؟')) return;
    state.schedule = null;
    save(); render();
    toast('تم المسح');
}

// ===================================================================
// ==================== التحميل والطباعة ===================================================================
// ===================================================================
async function downloadAll() {
    if (!state.schedule) { toast('لا يوجد برنامج', 'error'); return; }
    toast('جاري التحميل...', 'warning');
    for (const c of state.classes) {
        await downloadOne(c.id);
        await new Promise(r => setTimeout(r, 400));
    }
    toast('تم التحميل');
}

async function downloadOne(classId) {
    const c = findClass(classId);
    if (!c) return;
    const area = document.getElementById('scheduleArea');
    if (!area) return;
    const original = area.innerHTML;
    area.innerHTML = renderClassTable(classId);
    const target = document.getElementById('classTable_' + classId);
    if (!target) { area.innerHTML = original; return; }
    try {
        const canvas = await html2canvas(target, { backgroundColor: '#ffffff', scale: 2 });
        const link = document.createElement('a');
        link.download = 'برنامج_' + c.name.replace(/\s+/g, '_') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    } catch(e) { console.error(e); }
    area.innerHTML = original;
}

function printAll() { window.print(); }

// ===================================================================
// ==================== تصدير/استيراد ===================================================================
// ===================================================================
function exportData() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'school_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('تم التصدير');
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!confirm('سيتم استبدال كل البيانات. متابعة؟')) return;
                state = { ...state, ...data };
                if (state.teachers) {
                    state.teachers.forEach(t => {
                        if (!t.classAssignments) t.classAssignments = [];
                        t.classAssignments.forEach(a => {
                            if (!a.subjects) {
                                a.subjects = a.hours ? [{ subjectId: t.subjectId, hours: a.hours }] : [];
                                delete a.hours;
                            }
                        });
                    });
                }
                save(); render();
                toast('تم الاستيراد');
            } catch(err) { toast('ملف غير صالح', 'error'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ===================================================================
// ==================== بدء ===================================================================
// ===================================================================
load();
render();
</script>
